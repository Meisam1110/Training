name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev,postgres]"
      - name: Lint
        run: cd backend && ruff check .
      - name: Tests (>= 85% coverage of the core packages)
        run: cd backend && pytest tests/core tests/integrations --cov=app --cov-fail-under=85

  postgres:
    # QA-M13: PostgreSQL-only failures (NUL bytes, over-long values, JSON comparisons, ids beyond int range) never show on SQLite.
    # Migrations up/down/up, then the WHOLE core suite against PostgreSQL (one database per test cloned from a migrated template).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/tms
      TMS_TEST_PG_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev,postgres]"
      - name: Migrate up / down / up
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Core tests on PostgreSQL
        run: cd backend && pytest tests/core -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: cp .env.example .env && POSTGRES_PASSWORD=ci docker compose config -q
