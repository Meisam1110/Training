[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tms-backend"
version = "1.0.0"
description = "Training Management System (TMS) backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13",
  "pydantic>=2.6",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  # used by app.integrations / app.documents (Dev-B); pure-python, wheels available offline
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "aiosmtpd>=1.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/contracts.py"]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008"]   # FastAPI Depends()/Query() defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
